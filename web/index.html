<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tweetembed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f7f9fa;
    color: #0f1419;
    transition: background 0.2s, color 0.2s;
  }

  body.dark {
    background: #000000;
    color: #e7e9ea;
  }

  h1 {
    font-size: 28px;
    margin-bottom: 8px;
  }

  .subtitle {
    color: #536471;
    font-size: 15px;
    margin-bottom: 32px;
  }

  body.dark .subtitle {
    color: #8b98a5;
  }

  #drop-zone {
    width: 100%;
    max-width: 500px;
    padding: 48px 24px;
    border: 2px dashed #cfd9de;
    border-radius: 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }

  body.dark #drop-zone {
    border-color: #38444d;
  }

  #drop-zone:hover, #drop-zone.dragover {
    border-color: #1d9bf0;
    background: rgba(29, 155, 240, 0.05);
  }

  #drop-zone p {
    font-size: 16px;
    margin-bottom: 8px;
  }

  #drop-zone .hint {
    font-size: 13px;
    color: #536471;
  }

  body.dark #drop-zone .hint {
    color: #8b98a5;
  }

  #file-input {
    display: none;
  }

  #loading-section {
    display: none;
    text-align: center;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #cfd9de;
    border-top-color: #1d9bf0;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #loaded-section {
    display: none;
    width: 100%;
    max-width: 600px;
  }

  #account-info {
    font-size: 15px;
    margin-bottom: 16px;
    text-align: center;
    color: #536471;
  }

  body.dark #account-info {
    color: #8b98a5;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  #tweet-input {
    flex: 1;
    padding: 10px 14px;
    font-size: 15px;
    border: 1px solid #cfd9de;
    border-radius: 8px;
    outline: none;
    background: inherit;
    color: inherit;
  }

  body.dark #tweet-input {
    border-color: #38444d;
  }

  #tweet-input:focus {
    border-color: #1d9bf0;
  }

  #render-btn {
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 600;
    background: #1d9bf0;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  #render-btn:hover {
    background: #1a8cd8;
  }

  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .controls button {
    padding: 6px 14px;
    font-size: 13px;
    background: transparent;
    border: 1px solid #cfd9de;
    border-radius: 20px;
    cursor: pointer;
    color: inherit;
  }

  body.dark .controls button {
    border-color: #38444d;
  }

  .controls button:hover {
    background: rgba(29, 155, 240, 0.1);
  }

  #search-results {
    display: none;
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid #cfd9de;
    border-radius: 12px;
    margin-bottom: 16px;
  }

  body.dark #search-results {
    border-color: #38444d;
  }

  #search-results-count {
    font-size: 13px;
    color: #536471;
    padding: 8px 14px;
    border-bottom: 1px solid #cfd9de;
  }

  body.dark #search-results-count {
    color: #8b98a5;
    border-bottom-color: #38444d;
  }

  .search-result {
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid #eff3f4;
    transition: background 0.1s;
  }

  body.dark .search-result {
    border-bottom-color: #2f3336;
  }

  .search-result:last-child {
    border-bottom: none;
  }

  .search-result:hover, .search-result.selected {
    background: rgba(29, 155, 240, 0.06);
  }

  .search-result.active {
    border-left: 3px solid #1d9bf0;
    padding-left: 11px;
    background: rgba(29, 155, 240, 0.04);
  }

  .search-result-text {
    display: block;
    font-size: 14px;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-result-meta {
    display: block;
    font-size: 12px;
    color: #536471;
    margin-top: 2px;
  }

  body.dark .search-result-meta {
    color: #8b98a5;
  }

  #tweet-container {
    display: flex;
    justify-content: center;
  }

  #error-msg {
    display: none;
    color: #f4212e;
    font-size: 14px;
    text-align: center;
    margin-bottom: 12px;
  }

  #github-link {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 28px;
    height: 28px;
    color: #536471;
    transition: color 0.2s;
  }

  #github-link svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  #github-link:hover {
    color: #0f1419;
  }

  body.dark #github-link {
    color: #8b98a5;
  }

  body.dark #github-link:hover {
    color: #e7e9ea;
  }

  .guide-link {
    margin-top: 12px;
    font-size: 13px;
    color: #536471;
    text-align: center;
  }

  body.dark .guide-link {
    color: #8b98a5;
  }

  .guide-link a {
    color: #1d9bf0;
    text-decoration: none;
  }

  .guide-link a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<a id="github-link" href="https://github.com/duggan/tweetembed" target="_blank" rel="noopener" aria-label="View source on GitHub">
  <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
  </svg>
</a>

<h1>tweetembed</h1>
<p class="subtitle">Render tweets from your Twitter archive, entirely in-browser.</p>

<div id="upload-section">
  <div id="drop-zone">
    <p>Drop your Twitter archive zip here, or click to browse</p>
    <span class="hint">Works offline. Nothing is uploaded.</span>
  </div>
  <input type="file" id="file-input" accept=".zip">
  <p class="guide-link">
    Don't have your archive yet?
    <a href="https://www.tweetarchivist.com/download-twitter-archive-complete-guide" target="_blank" rel="noopener">How to download your Twitter archive</a>.
  </p>
</div>

<div id="loading-section">
  <div class="spinner"></div>
  <p>Loading archive&hellip;</p>
</div>

<div id="loaded-section">
  <p id="account-info"></p>
  <div class="input-row">
    <input type="text" id="tweet-input" placeholder="Search tweets or browse all">
    <button id="render-btn">Render</button>
  </div>
  <div id="search-results"></div>
  <div class="controls">
    <button id="theme-toggle">Dark</button>
    <button id="logo-toggle">X Logo</button>
    <button id="copy-html-btn" style="display:none">Copy HTML</button>
    <button id="download-html-btn" style="display:none">Download HTML</button>
  </div>
  <div id="error-msg"></div>
  <div id="tweet-container"></div>
</div>

<script type="module" src="dist/app.js"></script>
</body>
</html>
